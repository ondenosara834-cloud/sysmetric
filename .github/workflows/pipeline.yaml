name: Pipeline CI/CD

# Déclencheurs du pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissions minimales par défaut
permissions:
  contents: read

# Un seul pipeline actif par branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/sysmetrics

jobs:

  # CI : installation et lint
  install-dependencies:
    name: Installation & lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 app

  # CI : tests et couverture
  tests:
    name: Tests unitaires
    runs-on: ubuntu-24.04
    needs: install-dependencies
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest with coverage
        # --cov-fail-under=80 : le pipeline échoue si moins de 80 % du code est testé
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # DevSecOps : contrôles de sécurité
  # SAST : analyse statique du code
  sast-bandit:
    name: "Sécurité : SAST (Bandit)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install "bandit>=1.8"

      - name: Run Bandit
        run: bandit -r app -x app/tests -f txt -o bandit-report.txt

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

  # SCA : audit des dépendances
  dependency-audit:
    name: "Sécurité : dépendances (pip-audit)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt --strict

  # Détection de secrets dans l'historique Git
  secrets-scan:
    name: "Sécurité : secrets (Gitleaks)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Analyse CodeQL
  codeql:
    name: "Sécurité : CodeQL"
    runs-on: ubuntu-24.04
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  # Build et scan de l'image Docker
  docker-build-scan:
    name: Build & scan image Docker (Trivy)
    runs-on: ubuntu-24.04
    needs: [tests, sast-bandit, dependency-audit, secrets-scan]
    steps:
      - uses: actions/checkout@v4

      # Scan du Dockerfile : mauvaises pratiques (root, apt sans nettoyage...)
      # NB : les versions de trivy-action < 0.35.0 ont été compromises en mars 2026.
      #      Toujours utiliser v0.35.0 ou plus (idéalement épinglé par SHA).
      - name: Scan Dockerfile (Trivy config)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (sans la publier)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          load: true
          push: false
          tags: sysmetrics:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test du conteneur
        run: |
          docker run -d --name smoke -p 8000:8000 sysmetrics:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fs http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs smoke
          exit 1

      # Rapport HIGH/CRITICAL, puis blocage sur les CRITICAL corrigibles.
      - name: Rapport Trivy (HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: sysmetrics:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          output: trivy-report.txt

      - name: Afficher le rapport Trivy
        if: always()
        run: cat trivy-report.txt || true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Porte de sécurité (bloque sur CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: sysmetrics:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  # CD : publication sur Docker Hub
  publish-image:
    name: Publication image (Docker Hub)
    runs-on: ubuntu-24.04
    needs: [docker-build-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha

      - name: Build & push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-agent:latest
            ${{ env.IMAGE_NAME }}-agent:${{ github.sha }}
          cache-from: type=gha
