name: Pipeline CI/CD

# ---------------------------------------------------------------------------
# Déclencheurs : à chaque push / pull request sur main
# (+ lancement manuel depuis l'onglet "Actions" de GitHub)
# ---------------------------------------------------------------------------
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Principe du moindre privilège : par défaut le pipeline ne peut que LIRE le dépôt.
# Chaque job qui a besoin de plus le demande explicitement.
permissions:
  contents: read

# Un seul pipeline à la fois par branche.
# Sur une pull request : un nouveau push annule l'ancien pipeline (gain de temps).
# Sur main : on N'ANNULE JAMAIS un pipeline en cours (il peut être en train de
# publier l'image) ; le suivant attend simplement son tour.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  # =========================================================================
  # ÉTAPE 1 — CI : installation + qualité du code (lint)
  # =========================================================================
  install-dependencies:
    name: Installation & lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip            # met en cache les paquets pip -> pipeline plus rapide

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 app

  # =========================================================================
  # ÉTAPE 2 — CI : tests automatisés + couverture de code
  # =========================================================================
  tests:
    name: Tests unitaires
    runs-on: ubuntu-24.04
    needs: install-dependencies
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest with coverage
        # --cov-fail-under=80 : le pipeline échoue si moins de 80 % du code est testé
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # =========================================================================
  # ÉTAPE 3 — SÉCURITÉ (DevSecOps) : 4 contrôles en parallèle
  # =========================================================================

  # 3a. SAST : analyse statique du code Python à la recherche de failles
  #     (injection de commandes, eval, mots de passe en dur, SSL désactivé...)
  sast-bandit:
    name: "Sécurité : SAST (Bandit)"
    runs-on: ubuntu-24.04
    needs: install-dependencies
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install "bandit>=1.8"

      - name: Run Bandit
        # -r app        : analyse récursive du dossier app
        # -x app/tests  : on ignore les tests (les "assert" y sont normaux)
        run: |
          bandit -r app -x app/tests -f txt -o bandit-report.txt || true
          cat bandit-report.txt
          # Ce second appel fait échouer le job s'il reste une faille
          bandit -r app -x app/tests

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

  # 3b. SCA : vérifie que les bibliothèques de requirements.txt
  #     n'ont pas de vulnérabilités connues (CVE)
  dependency-audit:
    name: "Sécurité : dépendances (pip-audit)"
    runs-on: ubuntu-24.04
    needs: install-dependencies
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt --strict

  # 3c. Détection de secrets (mots de passe, tokens, clés API) dans TOUT
  #     l'historique Git, pas seulement dans la dernière version
  secrets-scan:
    name: "Sécurité : secrets (Gitleaks)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # récupère tout l'historique des commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Requis uniquement si le dépôt appartient à une ORGANISATION GitHub
          # (licence gratuite sur gitleaks.io). Inutile pour un compte personnel.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # 3d. CodeQL : analyse sémantique avancée de GitHub
  #     Les résultats apparaissent dans l'onglet "Security" du dépôt.
  #     (Gratuit sur dépôt public ; sur dépôt privé il faut GitHub Advanced Security)
  codeql:
    name: "Sécurité : CodeQL"
    runs-on: ubuntu-24.04
    needs: install-dependencies
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write   # pour publier les alertes dans l'onglet Security
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  # =========================================================================
  # ÉTAPE 4 — BUILD de l'image Docker + scan de sécurité de l'image
  #           (ne démarre que si TOUS les tests et contrôles sont verts)
  # =========================================================================
  docker-build-scan:
    name: Build & scan image Docker (Trivy)
    runs-on: ubuntu-24.04
    needs: [tests, sast-bandit, dependency-audit, secrets-scan]
    steps:
      - uses: actions/checkout@v4

      # Scan du Dockerfile : mauvaises pratiques (root, apt sans nettoyage...)
      # NB : les versions de trivy-action < 0.35.0 ont été compromises en mars 2026.
      #      Toujours utiliser v0.35.0 ou plus (idéalement épinglé par SHA).
      - name: Scan Dockerfile (Trivy config)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"          # rapport uniquement (affiché dans les logs)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (sans la publier)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          load: true              # garde l'image en local pour la scanner
          push: false
          tags: sysmetrics:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test du conteneur
        run: |
          docker run -d --name smoke -p 8000:8000 sysmetrics:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fs http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs smoke
          exit 1

      # Scan des vulnérabilités de l'image (OS Debian + paquets Python)
      # Politique de sécurité en 2 temps :
      #  1) RAPPORT : toutes les failles HIGH et CRITICAL sont listées (n'échoue pas)
      #  2) PORTE DE QUALITÉ : le pipeline est BLOQUÉ s'il reste une faille
      #     CRITICAL qui a un correctif disponible.
      - name: Rapport Trivy (HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: sysmetrics:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          output: trivy-report.txt

      - name: Afficher le rapport Trivy
        if: always()
        run: cat trivy-report.txt || true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Porte de sécurité (bloque sur CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: sysmetrics:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true    # on ne bloque que sur les failles qui ont un correctif
          exit-code: "1"
          skip-setup-trivy: true  # Trivy est déjà installé par l'étape précédente

  # =========================================================================
  # ÉTAPE 5 — CD (Continuous Delivery) : publication de l'image sur GHCR
  #           Uniquement sur un push sur main (pas sur une pull request)
  # =========================================================================
  publish-image:
    name: Publication image (GHCR)
    runs-on: ubuntu-24.04
    needs: [docker-build-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write           # droit d'écrire dans GitHub Container Registry
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # fourni automatiquement par GitHub

      # Le nom d'image doit être en minuscules pour GHCR
      - name: Compute image name
        run: echo "IMAGE=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

      - name: Build & push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          push: true
          tags: |
            ${{ env.IMAGE }}-agent:latest
            ${{ env.IMAGE }}-agent:${{ github.sha }}
          cache-from: type=gha
